apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: team-beta
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "65.5.1"
    helm:
      values: |
        prometheus:
          prometheusSpec:
            retention: 6h
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
            storageSpec: {}
            serviceMonitorSelectorNilUsesHelmValues: false

        grafana:
          adminPassword: "admin"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          persistence:
            enabled: false

        alertmanager:
          alertmanagerSpec:
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi
            storage: {}

        nodeExporter:
          enabled: true

        kubeStateMetrics:
          enabled: true

        # Deliberately disabled: these each create a Service in kube-system
        # to scrape the corresponding control-plane component. Scraping
        # cluster-internal components from a namespaced platform-team
        # AppProject is a real privilege question - kept out of kube-system
        # entirely per that decision, rather than granting team-beta
        # write access there. On a real cluster these would typically be
        # scraped via the kubelet's own /metrics/cadvisor endpoint instead,
        # which doesn't require an in-namespace Service.
        kubeApiServer:
          enabled: true
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false
        coreDns:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
