apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: team-beta
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: "4.11.3"
    helm:
      values: |
        controller:
          service:
            type: LoadBalancer
          # kind clusters have no cloud LB provider - this Service will stay
          # Pending/Progressing forever. That's expected, not a failure -
          # already documented as a known environment constraint.
          admissionWebhooks:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
