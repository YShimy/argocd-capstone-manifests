apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-notifications-cm
    app.kubernetes.io/part-of: argocd
data:
  service.slack: |
    token: $slack-webhook-url

  template.app-sync-failed: |
    message: |
      :x: Sync failed for application *{{.app.metadata.name}}*.
      Revision: {{.app.status.sync.revision}}
      Reason: {{.app.status.operationState.message}}

  template.app-health-degraded: |
    message: |
      :warning: Application *{{.app.metadata.name}}* health degraded to *{{.app.status.health.status}}*.
      {{if .app.status.health.message}}Reason: {{.app.status.health.message}}{{end}}

  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      send: [app-sync-failed]

  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [app-health-degraded]

  subscriptions: |
    - recipients:
        - slack:argocd-alerts
      triggers:
        - on-sync-failed
        - on-health-degraded
