apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-metrics-monitors
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YShimy/argocd-capstone-manifests.git
    targetRevision: main
    path: monitoring/argocd-servicemonitors
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
