apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: team-beta
  namespace: argocd
spec:
  description: "Platform team - owns cluster infrastructure: ingress controller and observability stack"
  sourceRepos:
    - https://github.com/YShimy/argocd-capstone-manifests.git
    - https://kubernetes.github.io/ingress-nginx
    - https://prometheus-community.github.io/helm-charts
  destinations:
    - namespace: ingress-nginx
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: networking.k8s.io
      kind: IngressClass
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  roles:
    - name: platform-owner
      description: "Full access to team-beta's infrastructure apps"
      policies:
        - p, proj:team-beta:platform-owner, applications, *, team-beta/*, allow
      groups:
        - team-beta-group
