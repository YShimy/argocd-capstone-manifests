apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-dashboards
  namespace: argocd
spec:
  project: team-beta
  source:
    repoURL: https://github.com/YShimy/argocd-capstone-manifests.git
    targetRevision: main
    path: monitoring/grafana-dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
