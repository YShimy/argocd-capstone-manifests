apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: capstone-app
  labels:
    app: capstone-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capstone-app
  template:
    metadata:
      labels:
        app: capstone-app
    spec:
      containers:
        - name: capstone-app
          image: yshimy/capstone-app:latest
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "v1"
            - name: FAILURE_RATE
              value: "0"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
  strategy:
    canary:
      canaryService: capstone-app-canary
      stableService: capstone-app-stable
      trafficRouting:
        nginx:
          stableIngress: capstone-app
      steps:
        - setWeight: 20
        # TODO (Section 4): replace this manual pause with an automated
        # `analysis` step once kube-prometheus-stack is deployed. The
        # AnalysisTemplate will use the `prometheus` provider (not `web`),
        # querying app_health_status via PromQL - Prometheus text format
        # from /metrics can't be parsed by the `web` provider's jsonPath.
        - pause: {duration: 30s}
        - setWeight: 50
        - pause: {duration: 30s}
        - setWeight: 100
